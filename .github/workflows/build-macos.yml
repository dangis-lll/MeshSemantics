name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-macos.yml"
      - "main.py"
      - "main.spec"
      - "requirements.txt"
      - "meshsemantics/**"

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: meshlabeler
          python-version: "3.10"

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Create macOS icon
        shell: bash -el {0}
        run: |
          mkdir -p build/app.iconset
          sips -z 16 16 meshsemantics/assets/app.png --out build/app.iconset/icon_16x16.png
          sips -z 32 32 meshsemantics/assets/app.png --out build/app.iconset/icon_16x16@2x.png
          sips -z 32 32 meshsemantics/assets/app.png --out build/app.iconset/icon_32x32.png
          sips -z 64 64 meshsemantics/assets/app.png --out build/app.iconset/icon_32x32@2x.png
          sips -z 128 128 meshsemantics/assets/app.png --out build/app.iconset/icon_128x128.png
          sips -z 256 256 meshsemantics/assets/app.png --out build/app.iconset/icon_128x128@2x.png
          sips -z 256 256 meshsemantics/assets/app.png --out build/app.iconset/icon_256x256.png
          sips -z 512 512 meshsemantics/assets/app.png --out build/app.iconset/icon_256x256@2x.png
          sips -z 512 512 meshsemantics/assets/app.png --out build/app.iconset/icon_512x512.png
          sips -z 1024 1024 meshsemantics/assets/app.png --out build/app.iconset/icon_512x512@2x.png
          iconutil -c icns build/app.iconset -o build/app.icns

      - name: Build app bundle
        shell: bash -el {0}
        run: |
          pyinstaller --clean -y main.spec
          test -d dist/MeshSemantics.app

      - name: Zip app bundle
        shell: bash -el {0}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MeshSemantics.app dist/MeshSemantics-macos.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: MeshSemantics-macos-app
          path: dist/MeshSemantics-macos.zip
