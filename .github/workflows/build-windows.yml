name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-windows.yml"
      - "build_main.bat"
      - "main.py"
      - "main-windows-onefile.spec"
      - "requirements.txt"
      - "meshsemantics/**"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: meshlabeler
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --clean -y main-windows-onefile.spec
          if (-not (Test-Path "dist\MeshSemantics.exe")) {
            throw "dist\MeshSemantics.exe was not created."
          }

      - name: Zip executable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MeshSemantics.exe" -DestinationPath "dist\MeshSemantics-windows-onefile.zip" -Force

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: MeshSemantics-windows-onefile
          path: dist/MeshSemantics-windows-onefile.zip
